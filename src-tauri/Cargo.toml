[package]
name = "coreagent"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "coreagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database & ORM
sea-orm = { version = "1.0", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
sea-orm-migration = { version = "1.0" }
tokio = { version = "1.40", features = ["full"] }

# AI Agent Framework
rig-core = "0.30"

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"

# Store Plugin
tauri-plugin-store = "2"

# Perception - Vision (desktop only)
xcap = "0.8.1"

# Perception - Audio (cross-platform)
tauri-plugin-mic-recorder = "2.0"

# OpenAI API integration
async-openai = { version = "0.32.4", features = ["audio", "chat-completion"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
base64 = "0.22"

# Anthropic - true streaming support
async-anthropic = "0.6.0"

# Image processing
image = "0.25"

# Async utilities
futures-util = "0.3"
futures = "0.3"

